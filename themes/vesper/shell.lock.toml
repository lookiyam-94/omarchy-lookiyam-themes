# Lock screen password card. The wallpaper stays behind it, blurred.
# A near-black Vesper card with a thin border in the theme's one point
# of light, which turns soft red after a wrong password.
background       = "#08060b"
background-alpha = 0.85
text             = "#e2dde9"
placeholder      = "#938aa0"
text-error       = "#d4868d"
border           = "#b6a0d6"
border-active    = "#b6a0d6"
border-error     = "#d4868d"
border-alpha     = 1.0
selection        = "#b6a0d6"
selection-alpha  = 0.35
