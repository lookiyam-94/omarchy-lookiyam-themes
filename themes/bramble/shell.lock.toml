# Lock screen password card. The wallpaper stays behind it, blurred.
# A near-black Bramble card with a thin border in the theme's one point
# of light, which turns soft red after a wrong password.
background       = "#0a0609"
background-alpha = 0.85
text             = "#e6dde1"
placeholder      = "#9a8a92"
text-error       = "#e0868d"
border           = "#c791a9"
border-active    = "#c791a9"
border-error     = "#e0868d"
border-alpha     = 1.0
selection        = "#c791a9"
selection-alpha  = 0.35
